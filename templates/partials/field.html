{% comment %}Campo de formulario: etiqueta arriba, ayuda y error debajo, enlazados por aria-describedby.{% endcomment %}
<div class="{{ class|default:'' }}">
  <label for="{{ field.id_for_label }}" class="label">
    {{ field.label }}{% if field.field.required %}<span class="text-ink-soft" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.auto_id }}_help" class="help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <p id="{{ field.auto_id }}_error" class="field-error"><i class="ph ph-warning-circle mt-0.5" aria-hidden="true"></i>{{ field.errors|first }}</p>
  {% endif %}
</div>
