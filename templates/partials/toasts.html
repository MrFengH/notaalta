<div class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-end gap-2 sm:inset-x-auto sm:right-6 sm:bottom-6" data-toasts role="status" aria-live="polite">
  {% for message in messages %}
    <div class="toast" data-toast data-tone="{{ message.tags }}">
      <i class="ph {% if message.tags == 'success' %}ph-check-circle text-success{% elif message.tags == 'error' %}ph-warning-circle text-danger{% elif message.tags == 'warning' %}ph-warning text-warn{% else %}ph-info text-info{% endif %} mt-0.5 text-xl" aria-hidden="true"></i>
      <p class="flex-1">{{ message }}</p>
      <button type="button" class="-m-1 grid size-8 shrink-0 place-items-center rounded-sm text-ink-soft hover:bg-sage hover:text-ink" data-toast-close aria-label="Cerrar aviso"><i class="ph ph-x" aria-hidden="true"></i></button>
    </div>
  {% endfor %}
</div>
<template id="toast-template">
  <div class="toast" data-toast>
    <i class="ph ph-check-circle mt-0.5 text-xl text-success" aria-hidden="true" data-toast-icon></i>
    <p class="flex-1" data-toast-text></p>
    <button type="button" class="-m-1 grid size-8 shrink-0 place-items-center rounded-sm text-ink-soft hover:bg-sage hover:text-ink" data-toast-close aria-label="Cerrar aviso"><i class="ph ph-x" aria-hidden="true"></i></button>
  </div>
</template>
