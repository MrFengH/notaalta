<div class="flex h-16 shrink-0 items-center border-b border-line px-5">
  <a href="{% url 'dashboard:overview' %}" class="text-lg font-semibold tracking-[-0.03em]">Nota Alta <span class="font-normal text-ink-soft">Panel</span></a>
</div>
<nav class="flex-1 overflow-y-auto px-3 py-4" aria-label="Secciones del panel">
  <ul class="space-y-0.5 text-[15px]">
    {% for key, label, icon, url_name in dash_nav %}
      <li>
        <a href="{% url url_name %}" class="flex h-10 items-center gap-3 rounded-sm px-3 transition-colors {% if section == key %}bg-pine-tint font-semibold text-pine{% else %}text-ink-soft hover:bg-ground hover:text-ink{% endif %}" {% if section == key %}aria-current="page"{% endif %}>
          <i class="ph {{ icon }} text-lg" aria-hidden="true"></i>{{ label }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
<div class="border-t border-line p-4 text-sm">
  <a href="{% url 'core:home' %}" class="flex h-9 items-center gap-2 text-ink-soft hover:text-ink"><i class="ph ph-arrow-square-out" aria-hidden="true"></i>Ver tienda</a>
  <a href="{% url 'admin:index' %}" class="flex h-9 items-center gap-2 text-ink-soft hover:text-ink"><i class="ph ph-gear-six" aria-hidden="true"></i>Admin de Django</a>
  <p class="mt-2 truncate text-xs text-ink-soft" title="{{ user.email }}">{{ user.email }}</p>
</div>
